# Supply-chain policy, enforced in CI by cargo-deny.

[graph]
all-features = true

[advisories]
# Any known vulnerability or unmaintained/yanked crate fails the build.
unmaintained = "all"
yanked = "deny"
# Each exception names the advisory, why it is acceptable and when to revisit.
ignore = [
    # basic-toml is unmaintained (not vulnerable). It is only used at build
    # time by askama, a proc-macro of UniFFI's binding generator, to read
    # template configuration; it never processes untrusted input and is not
    # part of the app. Revisit on every UniFFI update.
    { id = "RUSTSEC-2026-0374", reason = "build-time only via uniffi_bindgen/askama; not shipped" },
]

[licenses]
# Only permissive licenses compatible with distributing an MIT-licensed app.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # File-level copyleft. Allowed for unmodified dependencies only
    # (cssparser, dtoa-short via ammonia): modifying them would require
    # publishing the modified files.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own unpublished crates are fine.
allow-wildcard-paths = true

[sources]
# Crates may only come from crates.io; no git or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
