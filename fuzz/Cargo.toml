[package]
name = "markdown-editor-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
markdown-editor-core = { path = "../crates/core" }

[[bin]]
name = "render_html"
path = "fuzz_targets/render_html.rs"
test = false
doc = false
bench = false

# Kept out of the main workspace: fuzzing needs the nightly toolchain.
[workspace]
