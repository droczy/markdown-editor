[package]
name = "markdown-editor-core"
description = "Platform-independent core of the markdown editor: Markdown parsing and safe HTML rendering."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Markdown parser (CommonMark + GitHub Flavored Markdown). Default features
# (CLI, syntect, bon) are disabled to keep the dependency tree small.
comrak = { version = "0.59.0", default-features = false }
# HTML sanitizer used as a second line of defence after comrak.
ammonia = "4.2.4"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"

[lints]
workspace = true
