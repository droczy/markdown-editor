name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: workflows can read the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  pr-title:
    name: PR title follows Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        # The title is passed via env, never interpolated into the script,
        # to prevent shell injection through crafted PR titles.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|sec|test|docs|refactor|perf|build|ci|chore)(\([a-z0-9-]+\))?!?: .{1,72}$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(core): add tables'"
            exit 1
          fi

  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest runs on Apple Silicon; Linux guards portability.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --workspace --release --locked

  coverage:
    name: Coverage (min. 95 % lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov
      # The binding generator is a build tool without logic of its own.
      - run: cargo llvm-cov --workspace --exclude uniffi-bindgen --release --locked --fail-under-lines 95

  supply-chain:
    name: Advisories, licenses, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  macos-app:
    name: macOS app
    runs-on: macos-26
    env:
      XCODE_VERSION: "26.6"
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Install XcodeGen (pinned, checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Lint Swift sources
        working-directory: apps/macos
        run: |
          xcrun swift-format lint --strict --recursive App UITests \
            Packages/MarkdownEditorKit/Sources Packages/MarkdownEditorKit/Tests \
            Packages/MarkdownEditorKit/Package.swift
      - name: Build Rust core (XCFramework + Swift bindings)
        run: scripts/build-core-xcframework.sh
      - name: Unit tests (MarkdownEditorKit)
        working-directory: apps/macos/Packages/MarkdownEditorKit
        run: swift test
      - name: Generate Xcode project
        working-directory: apps/macos
        run: xcodegen generate
      - name: Build release app
        working-directory: apps/macos
        run: |
          xcodebuild build -project MarkdownEditor.xcodeproj -scheme MarkdownEditor \
            -configuration Release -derivedDataPath build -quiet
      - name: Verify app security properties
        run: scripts/verify-macos-app.sh apps/macos/build/Build/Products/Release/MarkdownEditor.app
      - name: UI tests
        working-directory: apps/macos
        run: |
          xcodebuild test -project MarkdownEditor.xcodeproj -scheme MarkdownEditor \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build -quiet

  fuzz:
    name: Fuzzing (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz
      - name: Fuzz render_html for 2 minutes
        working-directory: fuzz
        run: |
          mkdir -p corpus/render_html
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu render_html \
            corpus/render_html seeds/render_html -- \
            -max_total_time=120 -max_len=65536 -rss_limit_mb=4096
