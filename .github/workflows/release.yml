name: Release

# Builds a release from a signed version tag (vX.Y.Z or vX.Y.Z-beta.N) and
# creates a draft GitHub release with the app, an SBOM of its Rust crates
# and SHA-256 checksums. GitHub signs attestations of the build provenance
# and the SBOM. The maintainer reviews the draft and publishes it by hand;
# published releases are immutable (repository setting).
#
# A manual run is a rehearsal for a planned tag: it checks and builds
# everything and keeps the files as a workflow artifact, but attests and
# publishes nothing. See docs/releasing.md.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Planned tag, e.g. v0.1.0-beta.1 (rehearsal: nothing is published)"
        required: true
        type: string

# Every job states exactly the permissions it needs.
permissions: {}

# Releases never run in parallel or cancel each other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check tag, commit and version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # reads the tag and the history
      actions: read # reads the CI results of the commit
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, to check that the commit is on main.
          fetch-depth: 0
      - name: Release tag and version
        id: tag
        # Untrusted values are passed through the environment, never
        # interpolated into the script.
        env:
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          PLANNED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT" == push ]]; then tag="$PUSHED_TAG"; else tag="$PLANNED_TAG"; fi
          scripts/prepare-release.sh --self-test
          # Fails unless the tag is a release tag matching the app version,
          # the CHANGELOG and the release notes; only then is it passed on.
          scripts/prepare-release.sh check "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Tag is signed and verified by GitHub
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          read -r type sha < <(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq '.object | "\(.type) \(.sha)"')
          if [[ "$type" != tag ]]; then
            echo "::error::$TAG is not an annotated, signed tag"
            exit 1
          fi
          verified="$(gh api "repos/$REPOSITORY/git/tags/$sha" --jq '.verification.verified')"
          if [[ "$verified" != true ]]; then
            echo "::error::GitHub could not verify the signature of $TAG"
            exit 1
          fi
      - name: Commit is on main and passed CI there
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main"
            exit 1
          fi
          passed="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push&status=success" --jq '.total_count')"
          if [[ "$passed" -lt 1 ]]; then
            echo "::error::CI has not passed on main for $SHA"
            exit 1
          fi

  build:
    name: Build, package and attest
    needs: check
    runs-on: macos-26
    timeout-minutes: 45
    # Builds run third-party build scripts, so this job cannot write to the
    # repository. It may only sign and store attestations.
    permissions:
      contents: read # reads the source code
      id-token: write # signs the attestations (short-lived Sigstore certificate)
      attestations: write # stores the attestations on GitHub
    env:
      TAG: ${{ needs.check.outputs.tag }}
      # Same toolchain as the CI job "macOS app".
      XCODE_VERSION: "26.6"
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Install XcodeGen (pinned, checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: Build Rust core (XCFramework + Swift bindings)
        run: scripts/build-core-xcframework.sh
      - name: Build release app
        working-directory: apps/macos
        run: |
          xcodegen generate
          xcodebuild build -project MarkdownEditor.xcodeproj -scheme MarkdownEditor \
            -configuration Release -derivedDataPath build -quiet
      - name: Verify app security properties
        run: scripts/verify-macos-app.sh apps/macos/build/Build/Products/Release/MarkdownEditor.app
      - name: Package app, SBOM, checksums and release notes
        id: package
        run: |
          scripts/prepare-release.sh package "$TAG" \
            apps/macos/build/Build/Products/Release/MarkdownEditor.app dist
          version="${TAG#v}"
          echo "zip=dist/MarkdownEditor-$version-macos-arm64.zip" >> "$GITHUB_OUTPUT"
          echo "sbom=dist/markdown-editor-$version.cdx.json" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sbom }}
            dist/SHA256SUMS
      - name: Attest SBOM of the app
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.zip }}
          sbom-path: ${{ steps.package.outputs.sbom }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Create draft release
    needs: [check, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the draft release and uploads its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          options=(--draft --verify-tag --title "Markdown Editor $TAG" --notes-file dist/release-notes.md)
          if [[ "$TAG" == *-beta.* ]]; then options+=(--prerelease); fi
          version="${TAG#v}"
          gh release create "$TAG" --repo "$REPOSITORY" "${options[@]}" \
            "dist/MarkdownEditor-$version-macos-arm64.zip" \
            "dist/markdown-editor-$version.cdx.json" \
            dist/SHA256SUMS
