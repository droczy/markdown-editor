name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never run two nightly runs at once; a manual run waits for the scheduled
# one instead of cancelling it.
concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Nightly toolchain for fuzzing, pinned for reproducible builds. Update
  # together with rust-toolchain.toml; use a nightly at least 14 days old.
  RUST_NIGHTLY: nightly-2026-10-29

jobs:
  # New advisories appear independently of our changes: check the locked
  # dependencies every night, not only when a pull request runs.
  advisories:
    name: Advisories (daily)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories

  fuzz:
    name: Fuzzing (30 minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_NIGHTLY" --profile minimal
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz@0.13.2
      - working-directory: fuzz
        run: |
          mkdir -p corpus/render_html
          cargo "+$RUST_NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu render_html \
            corpus/render_html seeds/render_html -- \
            -max_total_time=1800 -max_len=65536 -rss_limit_mb=4096 -timeout=10

  mutants:
    name: Mutation testing
    runs-on: ubuntu-latest
    # About 30 seconds per mutant; 95 mutants as of 2026-11. Raise the limit
    # when the number of mutants grows.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-mutants@27.1.0
      - run: cargo mutants --workspace --exclude uniffi-bindgen -- --release
