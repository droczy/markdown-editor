name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never run two nightly runs at once; a manual run waits for the scheduled
# one instead of cancelling it.
concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Nightly toolchain for fuzzing, pinned for reproducible builds. Update
  # together with rust-toolchain.toml; use a nightly at least 14 days old.
  RUST_NIGHTLY: nightly-2026-10-29

jobs:
  # New advisories appear independently of our changes: check the locked
  # dependencies every night, not only when a pull request runs.
  advisories:
    name: Advisories (daily)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories

  fuzz:
    name: Fuzzing (30 minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_NIGHTLY" --profile minimal
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-fuzz@0.13.2
      - working-directory: fuzz
        run: |
          mkdir -p corpus/render_html
          cargo "+$RUST_NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu render_html \
            corpus/render_html seeds/render_html -- \
            -max_total_time=1800 -max_len=65536 -rss_limit_mb=4096 -timeout=10

  mutants:
    name: Mutation testing (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    # About 30 seconds per mutant; 202 mutants as of 2026-11, about 50 per
    # shard. Add a shard when one takes longer than 40 minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-mutants@27.1.0
      - name: Test mutants with a memory limit
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # A mutant can make a test allocate without bound. A runner that
          # runs out of memory is shut down without any result, so limit
          # every process to 8 GiB of address space (the tests peak at about
          # 1.4 GB): such a mutant then fails its tests and counts as caught.
          ulimit -v $((8 * 1024 * 1024))
          # Prove that the limit is enforced before relying on it. Mapping
          # 9 GiB reserves address space only, never memory.
          python3 -I -c '
          import mmap
          try:
              mmap.mmap(-1, 9 * 1024**3)
          except OSError:
              raise SystemExit(0)
          print("::error::The memory limit for mutation testing is not enforced.")
          raise SystemExit(1)
          '
          cargo mutants --workspace --exclude uniffi-bindgen --shard "$SHARD/4" -- --release
      # Keep the per-mutant logs, so that a failed night can be diagnosed.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          retention-days: 14
