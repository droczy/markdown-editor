version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
    # Wait before adopting new releases to reduce exposure to compromised
    # packages; security updates are not delayed.
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
