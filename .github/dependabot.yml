version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
    # Wait before adopting new releases to reduce exposure to compromised
    # packages; security updates are not delayed.
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # All steps of the CodeQL Action (init, analyze) must use the same
    # version, so they are updated in one pull request.
    groups:
      codeql-action:
        patterns: ["github/codeql-action*"]
    commit-message:
      prefix: ci
