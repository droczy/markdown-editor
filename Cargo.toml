[workspace]
resolver = "3"
members = ["crates/core", "crates/ffi", "tools/uniffi-bindgen"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/droczy/markdown-editor"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = true
codegen-units = 1
# Keep unwinding (the default): UniFFI turns a Rust panic into a Swift error,
# so an unexpected bug in the core cannot crash the app and lose unsaved text.
